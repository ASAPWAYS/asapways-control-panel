[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_BASE_URL = "/api/v1/admin"

# Proxy API calls to the Railway backend (mirrors the Vite dev proxy)
[[redirects]]
  from = "/api/*"
  to = "https://asapwaysbackend-production.up.railway.app/api/:splat"
  status = 200

# SPA fallback so react-router routes survive a refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
